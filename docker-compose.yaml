services:
  app:
    container_name: ${CONTAINER_NAME:-production-meu-website-fe}
    image: ${APP_IMAGE:-meu-website-fe:0.1-prod}
    ports:
      - "${PORT_APP:-8136}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - meu-solutions-product-alpha-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  meu-solutions-product-alpha-net:
    external: true
    name: meu-solutions-product-alpha-net
