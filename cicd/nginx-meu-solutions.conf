#
# Reference host Nginx config for https://meu-solutions.com
#
# Prerequisites before enabling:
#   1. DNS A record meu-solutions.com -> 103.72.98.149
#   2. TLS certificate for meu-solutions.com (certbot)
#   3. FE container healthy on 127.0.0.1:8136
#   4. BE container healthy on 127.0.0.1:7059
#
# Install as /etc/nginx/sites-available/meu-solutions.com,
# then symlink to sites-enabled and run `nginx -t && systemctl reload nginx`.
# ==========================================

upstream meu_website_fe {
    server 127.0.0.1:8136;
}

server {
    listen 80;
    server_name meu-solutions.com www.meu-solutions.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name meu-solutions.com www.meu-solutions.com;

    ssl_certificate     /etc/letsencrypt/live/meu-solutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meu-solutions.com/privkey.pem;

    client_max_body_size 20m;

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:7059/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Next.js immutable static assets
    location /_next/static/ {
        proxy_pass http://meu_website_fe;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Next.js application
    location / {
        proxy_pass http://meu_website_fe;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
