#
# CI/CD for meu-website frontend.
# Compatible with the older GitLab CI on gitlab.meu-solutions.com:
# - no cache:key.files
# - no workflow/default/needs/dotenv reports
#
# Required GitLab CI/CD variables:
#   REGISTRY_USER
#   CI_PERMISSION
#
# Deploy branch: release/product
# Commit message must start with: [tag]0.1-prod
# ==========================================

stages:
  - source
  - build
  - deploy

variables:
  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

.job_base: &job_base
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  only:
    refs:
      - release/product
    variables:
      - $CI_COMMIT_MESSAGE =~ /^\[tag\]0\.1-prod(\s|$)/

source:
  stage: source
  <<: *job_base
  tags:
    - runner-builder
  before_script:
    - echo "source=$CI_PIPELINE_SOURCE ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHORT_SHA"
  script:
    - bash cicd/source.sh
  artifacts:
    paths:
      - cicd-release.env
    expire_in: 1 day

build:image:
  stage: build
  <<: *job_base
  tags:
    - runner-builder
  dependencies:
    - source
  before_script:
    - echo "source=$CI_PIPELINE_SOURCE ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHORT_SHA"
    - . ./cicd-release.env
    - . ./cicd/env-param.sh
  script:
    - bash cicd/build.sh

deploy:production:
  stage: deploy
  <<: *job_base
  tags:
    - runner-inet-149
  dependencies:
    - source
  before_script:
    - echo "source=$CI_PIPELINE_SOURCE ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHORT_SHA"
    - . ./cicd-release.env
    - . ./cicd/env-param.sh
  script:
    - bash cicd/deploy.sh
  after_script:
    - echo "deploy:production finished - status=$CI_JOB_STATUS image=$IMAGE_REF"
  environment:
    name: production
    url: https://meu-solutions.com
