#
# CI/CD for meu-website frontend
# Pattern adapted from Week_11/accountant-frontend
#
# Required GitLab CI/CD variables:
#   REGISTRY_USER
#   CI_PERMISSION
#
# Deploy branch: release/product
# Commit message must start with: [tag]0.1-prod
# Image tag: 0.1-prod
# Container prefix: production
# ==========================================

stages:
  - source
  - build
  - deploy

variables:
  RELEASE_BRANCH: "release/product"
  RELEASE_MARKER_REGEX: '/^\[tag\]0\.1-prod(\s|$)/'

  DOCKER_BUILDKIT: "1"
  COMPOSE_DOCKER_CLI_BUILD: "1"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
  before_script:
    - echo "source=$CI_PIPELINE_SOURCE ref=$CI_COMMIT_REF_NAME sha=$CI_COMMIT_SHORT_SHA"

workflow:
  rules:
    - if: '$CI_COMMIT_REF_NAME == $RELEASE_BRANCH && $CI_COMMIT_MESSAGE =~ $RELEASE_MARKER_REGEX'
    - when: never

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/
  policy: pull-push

source:
  stage: source
  tags:
    - runner-builder
  script:
    - bash cicd/source.sh
  artifacts:
    reports:
      dotenv: cicd-release.env
    paths:
      - cicd-release.env
    expire_in: 1 day

build:image:
  stage: build
  tags:
    - runner-builder
  needs:
    - job: source
      artifacts: true
  script:
    - bash cicd/build.sh

deploy:production:
  stage: deploy
  tags:
    - runner-inet-149
  interruptible: false
  needs:
    - job: source
      artifacts: true
    - job: build:image
      artifacts: false
  resource_group: production
  script:
    - bash cicd/deploy.sh
  after_script:
    - echo "deploy:production finished - status=$CI_JOB_STATUS image=$IMAGE_REF"
  environment:
    name: production
    url: https://meu-solutions.com
